<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work | Bruno Oliveira</title>
  <meta name="description" content="Projetos de design gráfico, identidade visual, direção de arte e design editorial de Bruno Oliveira.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=League+Gothic&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="work">

  <!-- 01. HEADER -->
  <header class="portfolio-header" id="site-header"></header>

  <!-- 02. CONTEÚDO PRINCIPAL -->
  <div class="projects-spacer" aria-hidden="true"></div>

  <main class="main-layout">
    <section class="projects-list" aria-label="Projetos selecionados" data-cms-region="work.projects">
      <div class="projects-list__items" id="projects-list"></div>

      <section class="archive-section" aria-labelledby="archive-title" data-cms-region="work.archive">
        <h2 class="archive-title" id="archive-title">Archive</h2>
        <ul class="archive-list" id="archive-list"></ul>
        <a href="#" class="misc-link" id="misc-link">misc</a>
      </section>
    </section>

    <aside class="preview-panel" id="preview-panel" aria-hidden="true">
      <img src="" alt="" id="preview-img" class="preview-img">
    </aside>
  </main>

  <!-- 03. FOOTER -->
  <footer class="site-footer" id="site-footer"></footer>

  <!-- 04. JAVASCRIPT -->
  <script src="script.js"></script>
</body>

</html>
